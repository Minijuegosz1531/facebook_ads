# Unified compose for switching between the three API implementations and the
# two frontends.
#
# All three APIs expose the SAME host port (8000) AND share the docker network
# alias `api`, so the frontends always talk to `http://api:8000` regardless of
# which backend is active. The host port matters for `pnpm dev`/curl; the alias
# matters for the dockerized frontends.
#
# APIs (one at a time, they all bind host port 8000):
#
#   docker compose --profile python up --build       # FastAPI       (stub)
#   docker compose --profile go     up --build       # Go API        (stub)
#   docker compose --profile nest   up --build       # NestJS        (stub)
#
# Frontends (run IN PARALLEL with any API):
#
#   docker compose --profile web         up --build  # Next.js  → :3000
#   docker compose --profile web-angular up --build  # Angular → :4200
#
# Full backend stacks (with Postgres/Redis/workers):
#
#   docker compose --profile python-full up --build
#   docker compose --profile go-full     up --build
#
# Stop everything:
#
#   docker compose --profile python --profile go --profile nest \
#                  --profile python-full --profile go-full \
#                  --profile web --profile web-angular down
#
# The Makefile wraps the above as `make python`, `make web`, `make down`, etc.

services:
  # ─────────────────────────── shared infrastructure ───────────────────────
  postgres:
    image: postgres:16
    profiles: ["python-full"]
    environment:
      POSTGRES_USER: metaads
      POSTGRES_PASSWORD: metaads
      POSTGRES_DB: metaads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaads"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8
    profiles: ["python-full", "go-full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────── API: Python / FastAPI ───────────────────────
  api-python:
    profiles: ["python"]
    build: ./apps/api
    environment:
      USE_STUBS: "true"
      PORT: "8000"
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    networks:
      default:
        aliases: ["api"]

  api-python-full:
    profiles: ["python-full"]
    build: ./apps/api
    environment:
      USE_STUBS: "false"
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://metaads:metaads@postgres:5432/metaads
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:8000
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    networks:
      default:
        aliases: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-python:
    profiles: ["python-full"]
    build: ./apps/api
    environment:
      USE_STUBS: "false"
      DATABASE_URL: postgresql+asyncpg://metaads:metaads@postgres:5432/metaads
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["arq", "adapters.inbound.workers.worker_inspiration.WorkerSettings"]

  # ─────────────────────────── API: Go ─────────────────────────────────────
  api-go:
    profiles: ["go"]
    build: ./apps/api-go
    environment:
      ADDR: ":8000"
      QUEUE_DRIVER: "inprocess"
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    networks:
      default:
        aliases: ["api"]

  api-go-full:
    profiles: ["go-full"]
    build: ./apps/api-go
    environment:
      ADDR: ":8000"
      QUEUE_DRIVER: "asynq"
      REDIS_ADDR: "redis:6379"
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    networks:
      default:
        aliases: ["api"]
    depends_on:
      redis:
        condition: service_healthy

  worker-go:
    profiles: ["go-full"]
    build: ./apps/api-go
    entrypoint: ["/worker"]
    environment:
      QUEUE_DRIVER: "asynq"
      REDIS_ADDR: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────── API: NestJS ─────────────────────────────────
  api-nest:
    profiles: ["nest"]
    build: ./apps/api-nest
    environment:
      PORT: "8000"
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    networks:
      default:
        aliases: ["api"]

  # ─────────────────────────── Web: Next.js ────────────────────────────────
  # Production build (standalone output). Speaks to whichever API has the
  # network alias `api`. Start an API profile first; this can run alongside it.
  web:
    profiles: ["web"]
    build: ./apps/web
    environment:
      # The Next route handlers proxy to this URL for non-mock mode.
      API_BASE_URL: "http://api:8000"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"

  # ─────────────────────────── Web: Angular ────────────────────────────────
  # Static build served by nginx; /api/* is reverse-proxied to the API alias
  # (see apps/web-angular/nginx.conf).
  web-angular:
    profiles: ["web-angular"]
    build: ./apps/web-angular
    ports:
      - "4200:4200"

volumes:
  pgdata:
