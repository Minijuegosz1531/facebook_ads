services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: metaads
      POSTGRES_PASSWORD: metaads
      POSTGRES_DB: metaads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaads"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./apps/api
    environment:
      USE_STUBS: "false"
      DATABASE_URL: postgresql+asyncpg://metaads:metaads@postgres:5432/metaads
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:8000
      ENVIRONMENT: development
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./apps/api
    environment:
      USE_STUBS: "false"
      DATABASE_URL: postgresql+asyncpg://metaads:metaads@postgres:5432/metaads
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: arq adapters.inbound.workers.worker_inspiration.WorkerSettings

volumes:
  pgdata:
