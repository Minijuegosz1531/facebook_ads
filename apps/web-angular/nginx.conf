# nginx config for the Angular SPA in production.
#
# - serves the built bundle from /usr/share/nginx/html
# - SPA fallback: any unknown route returns index.html (Angular Router handles it)
# - /api/* is reverse-proxied to whichever backend has the docker network alias
#   `api` (api-python, api-go or api-nest — only one is active at a time).
#
# In dev (`pnpm start`), proxy.conf.json plays the same role. nginx replaces it
# in production so the SPA stays unaware of the backend host.

server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively (Angular hashes filenames).
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api/* to the active backend, stripping the /api prefix.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
