[project]
name = "meta-ads-platform-api"
version = "0.1.0"
description = "FastAPI microservice for the Meta Ads Platform (hexagonal architecture)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
