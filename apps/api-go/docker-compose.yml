# Multi-process deployment of the Go service: API + worker + Redis, the same
# shape as the Python (FastAPI + arq) setup.
#
#   docker compose up --build
#   curl localhost:8080/health
services:
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      QUEUE_DRIVER: asynq
      REDIS_ADDR: redis:6379
      ADDR: ":8080"
      BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["/worker"]
    environment:
      QUEUE_DRIVER: asynq
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
